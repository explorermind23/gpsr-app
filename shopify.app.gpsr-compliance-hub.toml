# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "63226bc8c9449ef95ec553cef9682e6f"
name = "GPSR Compliance Hub"
application_url = "https://gpsr-app-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-10"

  # Mandatory privacy webhooks — required for every public App Store app.
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks"

  # Clean up stored sessions when a merchant uninstalls.
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_files,read_metaobjects,read_products,write_files,write_metaobjects,write_products"

[auth]
redirect_urls = [ "https://gpsr-app-production.up.railway.app/auth/callback" ]
